<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-white.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://youtube.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://img.youtube.com https://i.ytimg.com https://cdn.plyr.io data:; connect-src 'self' https://www.youtube.com https://youtube.com https://noembed.com https://cdn.plyr.io; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <title>Veodee</title>
    <script src="/pre-style.js"></script>
    <script>
      // Restore a deep link stashed by public/404.html (GitHub Pages SPA
      // fallback) before the router reads window.location.
      (function () {
        try {
          var redirect = sessionStorage.getItem('spa-redirect');
          if (redirect) {
            sessionStorage.removeItem('spa-redirect');
            window.history.replaceState(null, '', redirect);
          }
        } catch {
          // sessionStorage/history unavailable - ignore.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
