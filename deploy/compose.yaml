# veodee — self-hosted runtime.
#
# The app is a static PWA served by nginx. It joins the shared "edge" network
# owned by the standalone reverse proxy; it publishes no ports itself.
#
#   docker compose -f deploy/compose.yaml --profile deploy pull
#   docker compose -f deploy/compose.yaml --profile deploy up -d
#
# Continuous deployment: `--profile deploy` adds freshdock, which recreates the
# opted-in `veodee` container when a newer image is published — no inbound
# access, no SSH credentials. Updates are health-gated with automatic rollback.
# Uses the same updater as the other apps on this host.
name: veodee

services:
  veodee:
    image: ${VEODEE_IMAGE:-ghcr.io/petermichon/veodee:latest}
    networks:
      edge:
        aliases:
          - veodee
    # freshdock only keeps an update if the new container becomes healthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Opt in to freshdock; `live` updates on every new digest.
    labels:
      - "freshdock.enable=true"
      - "freshdock.mode=live"
    restart: unless-stopped

  # Pull-based auto-updater. Needs a writable Docker socket; never updates
  # itself (freshdock.mode=off).
  freshdock:
    image: ghcr.io/turbootzz/freshdock:latest
    profiles: ["deploy"]
    command: ["run"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "freshdock.mode=off"
    restart: unless-stopped

networks:
  edge:
    external: true
    name: edge
