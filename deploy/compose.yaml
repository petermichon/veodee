# veodee — self-hosted runtime.
#
# The app is a static PWA served by nginx. It joins the shared "edge" network
# owned by the standalone reverse proxy; it publishes no ports itself.
#
#   docker compose pull && docker compose up -d
#
# Continuous deployment: the `watchtower` service polls the registry and
# recreates only the labelled `veodee` container when the published image
# changes. We use the maintained fork `nickfedor/watchtower` because
# `containrrr/watchtower` was archived in Dec 2025.
#
# One-time host setup:
#   1. Authenticate to GHCR so private images can be pulled (skip if the
#      package is public). Store it at the path mounted below:
#        docker login ghcr.io -u <github-user> -p <token with read:packages>
#   2. docker compose pull && docker compose up -d
name: veodee

services:
  veodee:
    image: ${VEODEE_IMAGE:-ghcr.io/petermichon/veodee:latest}
    networks:
      edge:
        aliases:
          - veodee
    restart: unless-stopped
    # Opt this container into Watchtower. With --label-enable, Watchtower only
    # updates containers carrying this label, so nothing else on the host is
    # touched (including Watchtower itself, which stays pinned).
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    # Pinned on purpose: this container holds root-equivalent access via the
    # Docker socket, so upgrades are deliberate. Bump the tag to update.
    image: nickfedor/watchtower:1.22.3
    command:
      - --label-enable
      - --cleanup
      - --interval
      - "300"
      - --update-on-start
    environment:
      # Registry auth is read from /config/config.json.
      DOCKER_CONFIG: /config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR credentials from the host (`docker login ghcr.io`). Mount the
      # directory, not the file, so refreshed credentials propagate.
      - ${HOST_DOCKER_CONFIG_DIR:-/root/.docker}:/config:ro
    restart: unless-stopped

networks:
  edge:
    external: true
    name: edge
